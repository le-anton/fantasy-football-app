<div mat-dialog-content>
  <div class="modal-header">
    <h2>Players for Position: {{ player.position }}</h2>
    <button *ngIf="canRestorePlayer" mat-flat-button color="accent" (click)="restorePlayer()" class="restore-player-button">
      Restore Player
    </button>
    <button class="close-modal-btn" (click)="closeModal()">×</button>
  </div>

  <div class="filter-container">
    <mat-form-field appearance="outline">
      <mat-label>Filter Players</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Enter name, team, etc.">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="modal-body">
    <div class="table-container" *ngIf="dataSource.data.length > 0; else noPlayers">
      <table mat-table [dataSource]="dataSource" matSort class="players-table">

        <!-- Player Name Column -->
        <ng-container matColumnDef="playerName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
          <td mat-cell *matCellDef="let player"> {{ player.first_name + " " + player.second_name }} </td>
        </ng-container>

        <!-- Price Column -->
        <ng-container matColumnDef="now_cost">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Price </th>
          <td mat-cell *matCellDef="let player"> {{ player.now_cost / 10 | number : "1.1-1" }} </td>
        </ng-container>

        <!-- Dynamic Stats Columns -->
        <ng-container *ngFor="let stat of stats" [matColumnDef]="stat.name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ stat.label }} </th>
          <td mat-cell *matCellDef="let player"> {{ player[stat.name] }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let player; columns: displayedColumns;" (click)="selectPlayer(player)"></tr>
      </table>
    </div>

    <ng-template #noPlayers>
      <p class="no-players-message">No players found for this position or matching your filter.</p>
    </ng-template>
  </div>
</div>
