<header class="header {{ currentTheme }}">
  <div class="header-logo">
    <h1 (click)="navigateToHome()" class="header-title {{ currentTheme }}">
      fAntonsy Football App
    </h1>
  </div>
  <nav class="header-nav">
    <a [routerLink]="['/home']" routerLinkActive="active-link">Home</a>
    <a [routerLink]="['/edit']" routerLinkActive="active-link">Edit Team</a>
    <a [routerLink]="['/transfer']" routerLinkActive="active-link">Transfers</a>
  </nav>
  <div class="header-buttons">
    <button
      class="theme-toggle"
      (click)="changeTheme()"
      [ngClass]="themeService.isDarkMode ? 'dark-mode' : ''"
    >
      <span class="material-icons" *ngIf="themeService.isDarkMode"
        >light_mode</span
      >
      <span class="material-icons" *ngIf="!themeService.isDarkMode"
        >dark_mode</span
      >
    </button>

    <!-- <button class="button">Login</button>
    <button class="button">Sign Up</button> -->
  </div>
</header>
